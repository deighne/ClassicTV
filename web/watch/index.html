<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Classic TV — Watch</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="stylesheet" href="styles.css?v=4">
  <script src="https://cdn.jsdelivr.net/npm/hls.js@1/dist/hls.min.js"></script>
</head>
<body>
  <!-- Jellyfin Sign-in Screen -->
  <div id="login-screen" class="login-screen hidden">
    <form id="login-form" class="login-card">
      <h1 class="login-brand">CLASSIC TV</h1>
      <p class="login-sub">Connect to Jellyfin to stream channels in your browser.</p>
      <div class="field">
        <label for="server-url">Jellyfin Server</label>
        <input id="server-url" type="url" required placeholder="https://jellyfin.example.com">
      </div>
      <div class="field">
        <label for="username">Username</label>
        <input id="username" type="text" required autocomplete="username">
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input id="password" type="password" autocomplete="current-password">
      </div>
      <button id="login-btn" type="submit" class="btn-primary">Tune In</button>
      <button id="qc-btn" type="button" class="btn-secondary">Sign In with Quick Connect</button>
      <div id="qc-box" class="qc-box hidden" role="button" tabindex="0" title="Click to copy code">
        <div id="qc-label" class="qc-label">ENTER CODE IN JELLYFIN → QUICK CONNECT (CLICK TO COPY)</div>
        <div id="qc-code" class="qc-code">------</div>
      </div>
      <div id="login-error" class="login-error"></div>
    </form>
  </div>

  <!-- TV Playback Stage -->
  <div id="tv-stage" class="tv-stage hidden">
    <video id="tv-video" playsinline webkit-playsinline disablepictureinpicture crossorigin="anonymous"></video>
    <canvas id="crt-static" class="hidden" width="640" height="360"></canvas>

    <!-- Sony Trinitron Green OSD -->
    <div id="channel-bug" class="channel-bug hidden">
      <div class="bug-top">
        <span id="bug-number" class="bug-number"></span>
        <span id="bug-name" class="bug-name"></span>
      </div>
      <div id="bug-title" class="bug-title"></div>
    </div>

    <!-- Autoplay gesture fallback -->
    <div id="power-overlay" class="power-overlay hidden">
      <button id="power-btn" type="button" class="power-btn">Tap to Tune In</button>
    </div>

    <!-- Channel Drawer -->
    <aside id="channel-drawer" class="channel-drawer hidden">
      <div class="drawer-header">
        <span class="drawer-title">CHANNELS</span>
        <button id="drawer-close" type="button" class="hud-btn">Close</button>
      </div>
      <ul id="drawer-list" class="drawer-list"></ul>
    </aside>

    <!-- Mobile Remote Number Pad -->
    <div id="numpad" class="numpad hidden">
      <button type="button" class="numpad-key" data-digit="1">1</button>
      <button type="button" class="numpad-key" data-digit="2">2</button>
      <button type="button" class="numpad-key" data-digit="3">3</button>
      <button type="button" class="numpad-key" data-digit="4">4</button>
      <button type="button" class="numpad-key" data-digit="5">5</button>
      <button type="button" class="numpad-key" data-digit="6">6</button>
      <button type="button" class="numpad-key" data-digit="7">7</button>
      <button type="button" class="numpad-key" data-digit="8">8</button>
      <button type="button" class="numpad-key" data-digit="9">9</button>
      <button type="button" class="numpad-key" id="numpad-clear">CLR</button>
      <button type="button" class="numpad-key" data-digit="0">0</button>
      <button type="button" class="numpad-key" id="numpad-close">✕</button>
    </div>

    <!-- Top HUD -->
    <div id="hud-top" class="hud-top">
      <a href="/" class="hud-btn">← Hub</a>
      <button id="btn-signout" type="button" class="hud-btn">Switch User</button>
    </div>

    <!-- Bottom HUD Controls -->
    <div id="hud-bar" class="hud-bar">
      <div class="hud-dock">
        <div class="hud-status-row">
          <span class="live-dot" aria-hidden="true"></span>
          <div id="hud-status" class="hud-status"></div>
          <span class="hud-shortcuts">↑↓ CH · G Guide · C CC · M Mute · F Fullscreen</span>
        </div>
        <div class="hud-row">
          <div class="hud-group">
            <button id="btn-channels" type="button" class="hud-btn hud-btn-labeled" title="Channels">
              <svg class="hud-icon" viewBox="0 0 24 24" aria-hidden="true"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><circle cx="4" cy="6" r="1.2" fill="currentColor" stroke="none"/><circle cx="4" cy="12" r="1.2" fill="currentColor" stroke="none"/><circle cx="4" cy="18" r="1.2" fill="currentColor" stroke="none"/></svg>
              <span>Channels</span>
            </button>
            <div class="ch-rocker">
              <button id="btn-ch-down" type="button" class="hud-btn" title="Channel Down (↓)">CH −</button>
              <button id="btn-ch-up" type="button" class="hud-btn" title="Channel Up (↑)">CH +</button>
            </div>
            <button id="btn-guide" type="button" class="hud-btn hud-btn-labeled" title="TV Guide (G)">
              <svg class="hud-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><line x1="3" y1="10" x2="21" y2="10"/><line x1="9" y1="10" x2="9" y2="20"/></svg>
              <span>Guide</span>
            </button>
            <button id="btn-numpad" type="button" class="hud-btn hud-icon-btn" aria-label="Number Pad" title="Number Pad (0–9)">
              <svg class="hud-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="6" cy="6" r="1.5" fill="currentColor" stroke="none"/><circle cx="12" cy="6" r="1.5" fill="currentColor" stroke="none"/><circle cx="18" cy="6" r="1.5" fill="currentColor" stroke="none"/><circle cx="6" cy="12" r="1.5" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="1.5" fill="currentColor" stroke="none"/><circle cx="18" cy="12" r="1.5" fill="currentColor" stroke="none"/><circle cx="6" cy="18" r="1.5" fill="currentColor" stroke="none"/><circle cx="12" cy="18" r="1.5" fill="currentColor" stroke="none"/><circle cx="18" cy="18" r="1.5" fill="currentColor" stroke="none"/></svg>
            </button>
          </div>
          <div class="hud-group">
            <button id="btn-cc" type="button" class="hud-btn hud-icon-btn hidden" aria-label="Closed Captions" title="Closed Captions (C)">
              <svg class="hud-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="2" y="5" width="20" height="14" rx="2"/><path d="M10.5 9.8a2.5 2.5 0 1 0 0 4.4"/><path d="M17.5 9.8a2.5 2.5 0 1 0 0 4.4"/></svg>
            </button>
            <button id="btn-mute" type="button" class="hud-btn hud-icon-btn" aria-label="Mute" title="Mute (M)">
              <svg class="hud-icon icon-sound-on" viewBox="0 0 24 24" aria-hidden="true"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/></svg>
              <svg class="hud-icon icon-sound-off" viewBox="0 0 24 24" aria-hidden="true"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><line x1="23" y1="9" x2="17" y2="15"/><line x1="17" y1="9" x2="23" y2="15"/></svg>
            </button>
            <button id="btn-fullscreen" type="button" class="hud-btn hud-icon-btn" aria-label="Fullscreen" title="Fullscreen (F)">
              <svg class="hud-icon icon-fs-enter" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/></svg>
              <svg class="hud-icon icon-fs-exit" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3v3a2 2 0 0 1-2 2H3m18 0h-3a2 2 0 0 1-2-2V3m0 18v-3a2 2 0 0 1 2-2h3M3 16h3a2 2 0 0 1 2 2v3"/></svg>
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="/config.js"></script>
  <script src="app.js?v=4"></script>
</body>
</html>
