[pytest]
# Default options applied to every pytest run.
# --tb=short: compact tracebacks — shows the failing assertion without
#   scrolling through the full call stack for every test failure.
addopts = --tb=short

# Custom markers.
# Tests decorated with @pytest.mark.integration require a live jfmac +
# Sweet_Potato setup and are excluded from the default test run.
# To run integration tests explicitly:
#   python3 -m pytest tests/integration/ -m integration --run-integration
markers =
    integration: marks tests that require live hardware (jfmac + Sweet_Potato)
